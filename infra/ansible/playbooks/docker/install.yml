---
- name: Install Docker Engine on Raspberry Pis
  hosts: rpis
  become: true
  gather_facts: true

  vars:
    docker_codename: "{{ ansible_distribution_release }}"

  pre_tasks:
    - name: Ensure apt cache is up-to-date
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: Map architecture for Docker repo
      ansible.builtin.set_fact:
        docker_apt_arch: >-
          {{ 'arm64' if ansible_architecture in ['aarch64', 'arm64'] else
             'armhf' if ansible_architecture in ['armv7l', 'armv6l', 'armhf'] else
             ansible_architecture }}

    - name: Ensure /etc/apt/keyrings exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker GPG (ASCII)
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /tmp/docker.gpg.asc
        mode: "0644"

    - name: Install Docker key into /etc/apt/keyrings (Bookworm-safe)
      ansible.builtin.command:
        cmd: gpg --dearmor -o /etc/apt/keyrings/docker.gpg /tmp/docker.gpg.asc
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Set permissions on keyring
      ansible.builtin.file:
        path: /etc/apt/keyrings/docker.gpg
        mode: "0644"

    - name: Add Docker apt repository (signed-by)
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ docker_apt_arch }} signed-by=/etc/apt/keyrings/docker.gpg]
          https://download.docker.com/linux/debian {{ docker_codename }} stable
        filename: docker
        state: present
        update_cache: true

  tasks:
    - name: Install Docker Engine + Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure docker service is enabled and running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add user 'rpi' to docker group
      ansible.builtin.user:
        name: rpi
        groups: docker
        append: true
