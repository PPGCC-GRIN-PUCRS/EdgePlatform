- hosts: rpis
  become: true
  gather_facts: false
  tasks:
    - name: List Timeshift snapshots
      command: timeshift --list
      register: ts_list
      changed_when: false

    - name: Extract snapshot IDs (sorted)
      set_fact:
        ts_snapshots: >-
          {{ ts_list.stdout
             | regex_findall('([0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{2}-[0-9]{2}-[0-9]{2})')
             | sort }}

    - debug:
        var: ts_snapshots
